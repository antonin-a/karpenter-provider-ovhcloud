suite: OVH API credentials
templates:
  - templates/deployment.yaml
set:
  ovh.serviceName: project
tests:
  - it: reads a service account's client ID and secret from the credentials Secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVH_CLIENT_ID
            valueFrom:
              secretKeyRef: {name: ovh-credentials, key: clientId, optional: true}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVH_CLIENT_SECRET
            valueFrom:
              secretKeyRef: {name: ovh-credentials, key: clientSecret, optional: true}
  - it: still reads application keys, each optional so either kind of Secret starts the pod
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVH_APPLICATION_KEY
            valueFrom:
              secretKeyRef: {name: ovh-credentials, key: applicationKey, optional: true}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVH_APPLICATION_SECRET
            valueFrom:
              secretKeyRef: {name: ovh-credentials, key: applicationSecret, optional: true}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OVH_CONSUMER_KEY
            valueFrom:
              secretKeyRef: {name: ovh-credentials, key: consumerKey, optional: true}
